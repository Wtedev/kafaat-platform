<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=390"/><title>التحضير اليدوي — جوال</title>
<style>

.phone{width:360px;background:#fff;border-radius:28px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}

.name{font-weight:800;font-size:14px}.st{font-size:12px;color:#64748b}

.btns button{flex:1;border-radius:12px;padding:11px;font-weight:800;border:1px solid #cbd5e1;background:#fff}
