<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=1280"/><title>نتيجة البحث</title>
<style>
body{margin:0;background:linear-gradient(160deg,#EEF5FB,#F7FAFC);font-family:"Segoe UI",Tahoma,sans-serif;padding:32px}
.card{max-width:720px;margin:0 auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 40px rgba(15,23,42,.08)}
h1{margin:0;font-size:18px}.meta{color:#64748b;font-size:13px;margin-top:6px}
.search{margin-top:18px;display:flex;gap:8px}
.search input{flex:1;border:1px solid #cbd5e1;border-radius:12px;padding:12px}
.search button{background:#335483;color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:800}
.hit{margin-top:18px;padding:16px;border:1px solid #dbeafe;background:#f8fbff;border-radius:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-weight:800}.st{color:#047857;font-size:13px;font-weight:700}
.btns button{margin-right:8px;border-radius:12px;padding:10px 14px;font-weight:800;border:1px solid #cbd5e1;background:#fff}
.btns .p{background:#059669;color:#fff;border-color:#059669}
</style></head><body><div class="card">
<h1>قادة التطوع</h1>
<div class="meta">مسؤول التحضير: نورة السبيعي — بحث: القحطاني</div>
<div class="search"><input value="القحطاني"/><button>بحث</button></div>
<div class="hit"><div><div class="name">نورة سعد فهد القحطاني</div><div class="st">حاضر</div></div><div class="btns"><button class="p">حاضر</button><button>لم يحضر</button></div></div>
</div></body></html>
