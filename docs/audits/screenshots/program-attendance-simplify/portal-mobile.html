<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=390, initial-scale=1"/>
<title>بوابة المستفيد — جوال</title>
<style>
  body{margin:0;background:#eef3f8;font-family:"Segoe UI",Tahoma,sans-serif;padding:16px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;max-width:390px;margin:0 auto}
  .title{color:#335483;font-weight:800;font-size:15px}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:#64748b}
  .btn{margin-top:14px;display:inline-flex;background:#335483;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:700}
  .muted{margin-top:10px;display:inline-flex;border:1px solid #e2e8f0;border-radius:12px;padding:8px 12px;font-size:12px;color:#94a3b8}
  h1{font-size:18px;text-align:center;max-width:390px;margin:8px auto 14px}
</style>
</head>
<body>
<h1>بوابة المستفيد — حسب نوع يوم اليوم</h1>
<div class="card">
  <div class="title">قادة التطوع</div>
  <div class="row"><span>نسبة الحضور</span><strong style="color:#0f172a">16.7%</strong></div>
  <div class="row"><span>التحضير</span><strong style="color:#0f172a">QR الحضور</strong></div>
  <span class="btn">QR الحضور</span>
</div>
<div class="card" style="margin-top:12px">
  <div class="title">قادة التطوع — يوم عن بُعد</div>
  <div class="row"><span>التحضير</span><strong style="color:#0f172a">بانتظار فتح الجلسة</strong></div>
  <span class="muted">بانتظار فتح جلسة التحضير</span>
</div>
</body>
</html>
