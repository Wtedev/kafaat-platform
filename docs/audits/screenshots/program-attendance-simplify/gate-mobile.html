<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=390, initial-scale=1"/>
<title>بوابة QR — جوال</title>
<style>
  body{margin:0;background:#1e3a5f;font-family:"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 12px}
  .phone{width:360px;background:#fff;border-radius:28px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  h1{font-size:16px;margin:0} .meta{font-size:12px;color:#64748b;margin-top:6px}
  .box{margin-top:14px;background:#f5f8fc;border:1px solid #d7e2ef;border-radius:16px;padding:12px}
  .ok{color:#047857;font-size:12px;font-weight:700;margin-top:8px}
  .cam{margin-top:14px;height:210px;border-radius:16px;background:#0f172a;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-size:13px}
  .btn{margin-top:14px;width:100%;background:#335483;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700}
  input{width:100%;margin-top:8px;border:1px solid #cbd5e1;border-radius:12px;padding:10px;font-family:monospace}
</style>
</head>
<body>
<div class="phone">
  <h1>قادة التطوع</h1>
  <div class="meta">المتحضّرة: إدارة البرنامج</div>
  <div class="box">
    <div style="font-size:11px;color:#64748b">يوم التحضير (اليوم حسب توقيت الرياض)</div>
    <div style="font-weight:800;color:#335483;margin-top:4px">الأحد 3 أغسطس</div>
    <div style="font-family:monospace;font-size:12px;color:#64748b">2026-08-03</div>
    <div class="ok">يوم حضوري — المسح مفعّل لهذا اليوم فقط</div>
  </div>
  <div class="cam">كاميرا مسح QR</div>
  <label style="display:block;margin-top:14px;font-size:13px">أو أدخلي الرمز يدوياً</label>
  <input placeholder="KAFAAT-P…-R…"/>
  <button class="btn">تسجيل الحضور</button>
</div>
</body>
</html>
