<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=390"/>
<title>التحضير اليدوي — جوال</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#EEF5FB;padding:12px;color:#111}
  .card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 12px 24px rgba(15,23,42,.08)}
  h1{font-size:16px;margin:0 0 8px}
  .nav{display:flex;gap:6px;border-bottom:1px solid #e5e7eb;margin:12px 0}
  .nav a{padding:8px 10px;font-size:13px;font-weight:600;color:#6b7280;text-decoration:none}
  .nav a.on{color:#335483;border-bottom:2px solid #335483}
  .wrap{overflow-x:auto}
  table{width:100%;min-width:28rem;border-collapse:collapse;font-size:13px;border:1px solid #f3f4f6;border-radius:12px;overflow:hidden}
  thead{background:#e9eff6;color:#335483;font-size:11px}
  th,td{padding:10px 8px} th{text-align:right} .c{text-align:center}
  tbody tr{border-top:1px solid #f3f4f6}
  .pill{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:11px;background:#f3f4f6;color:#4b5563}
  .btns button{border-radius:8px;padding:5px 8px;font-size:11px;font-weight:600;border:1px solid #d1d5db;background:#fff;margin-inline-start:4px}
  .btns button.on{background:#374151;border-color:#374151;color:#fff}
</style>
</head>
<body>
<div class="card">
  <h1>قادة التطوع</h1>
  <div class="nav"><a>تحضير QR</a><a class="on">التحضير اليدوي</a></div>
  <div class="wrap">
    <table>
      <thead><tr><th>الاسم</th><th class="c">الحالة</th><th class="c">الإجراء</th></tr></thead>
      <tbody>
        <tr><td><strong>نورة سعد فهد القحطاني</strong></td><td class="c"><span class="pill">لم يحضر</span></td><td class="c"><span class="btns"><button>حاضر</button><button class="on">لم يحضر</button></span></td></tr>
        <tr><td><strong>أحمد محمد علي العتيبي</strong></td><td class="c"><span class="pill">لم يحضر</span></td><td class="c"><span class="btns"><button>حاضر</button><button class="on">لم يحضر</button></span></td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
