<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1100"/>
<title>تحضير QR — يوم عن بُعد</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#EEF5FB,#F7FAFC 45%,#e8eef6);padding:24px;color:#111}
  .card{max-width:48rem;margin:0 auto;background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 40px rgba(15,23,42,.08)}
  h1{font-size:18px;margin:0 0 4px} .meta{color:#4b5563;font-size:14px}
  .box{background:#f5f8fc;border:1px solid #d7e2ef;border-radius:16px;padding:12px 16px;font-size:12px;margin:16px 0;color:#335483}
  .nav{display:flex;gap:8px;border-bottom:1px solid #e5e7eb;margin:20px 0 16px}
  .nav a{padding:8px 12px;font-size:14px;font-weight:600;color:#6b7280;text-decoration:none}
  .nav a.on{color:#335483;border-bottom:2px solid #335483}
  .empty{background:#f5f8fc;border:1px solid #d7e2ef;border-radius:16px;padding:28px;text-align:center}
  .empty h2{margin:0;color:#335483;font-size:15px}
  .empty p{color:#4b5563;font-size:14px;line-height:1.6}
  .cta{display:inline-block;margin-top:12px;background:#335483;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>قادة التطوع</h1>
  <p class="meta">مسؤول التحضير: <strong style="color:#335483">لمى فؤاد سليمان المشيقح</strong></p>
  <div class="box">اليوم حسب توقيت الرياض<br><strong>الأربعاء 12 أغسطس</strong><br>نوع اليوم: عن بُعد</div>
  <div class="nav"><a class="on">تحضير QR</a><a>التحضير اليدوي</a></div>
  <div class="empty">
    <h2>تحضير QR غير متاح اليوم</h2>
    <p>مسح QR مخصّص لأيام الحضور الحضوري فقط حسب توقيت الرياض.</p>
    <p style="color:#0369a1;font-size:12px;font-weight:600">نوع اليوم الحالي: عن بُعد — استخدمي «التحضير اليدوي».</p>
    <a class="cta" href="#">الانتقال للتحضير اليدوي</a>
  </div>
</div>
</body>
</html>
